<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MortgageIQ — Free Quebec Mortgage Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,300&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <button class="nav-logo" onclick="restartEstimate()" title="Start over" aria-label="MortgageIQ — restart estimate">Mortgage<span>IQ</span></button>
  <div class="nav-pill" id="navPill"></div>
  <div class="lang-sw">
    <button class="lang-btn active" id="btnEN" onclick="setLang('en')">EN</button>
    <button class="lang-btn" id="btnFR" onclick="setLang('fr')">FR</button>
  </div>
</nav>

<section class="hero" id="home">
  <div class="hero-glow"></div>
  <div class="hero-inner">
    <div>
      <div class="eyebrow"><span class="eyebrow-dot"></span><span id="hEyebrow"></span></div>
      <h1 id="hH1"></h1>
      <p class="hero-sub" id="hSub"></p>
      <div class="hero-cta-row">
        <a href="#calc" class="btn-hero" onclick="scrollCalc(event)">
          <span id="hCta"></span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </a>
        <span class="hero-reassure" id="hNoCredit"></span>
      </div>
      <div class="hero-reviews">
        <div class="rev-avatars"><div class="rev-av">ML</div><div class="rev-av">SP</div><div class="rev-av">KT</div><div class="rev-av">JR</div></div>
        <div class="rev-txt"><span class="rev-stars">★★★★★</span><span id="hRevCount"></span></div>
      </div>
      <div class="hero-stats">
        <div class="hero-stat"><strong>30+</strong><span id="hStat1"></span></div>
        <div class="hero-stat"><strong>24h</strong><span id="hStat2"></span></div>
        <div class="hero-stat"><strong>$0</strong><span id="hStat3"></span></div>
      </div>
    </div>

    <div id="calc">
      <div class="calc-card">
        <div class="c-prog"><div class="c-prog-fill" id="progFill" style="width:20%"></div></div>
        <div class="c-ind">
          <div class="c-dots">
            <div class="c-dot active" id="d1"></div><div class="c-dot" id="d2"></div>
            <div class="c-dot" id="d3"></div><div class="c-dot" id="d4"></div><div class="c-dot" id="d5"></div>
          </div>
          <div class="c-counter" id="stepCtr"></div>
        </div>

        <!-- STEP 1 -->
        <div class="sp on" id="step1">
          <div class="c-title-row"><div class="c-title" id="s1t"></div><div class="c-hint" id="s1h"></div></div>
          <div class="c-body">
            <div class="fg">
              <label class="fl" id="purLbl"></label>
              <div class="pur-g">
                <div class="pur-ch sel" onclick="setPurpose(this,'purchase')" id="cpPurchase">
                  <div class="pur-icon">🏠</div>
                  <span class="pur-lbl" id="purPurchLbl"></span>
                  <span class="pur-sub" id="purPurchSub"></span>
                </div>
                <div class="pur-ch" onclick="setPurpose(this,'renewal')" id="cpRenewal">
                  <div class="pur-icon">🔄</div>
                  <span class="pur-lbl" id="purRenLbl"></span>
                  <span class="pur-sub" id="purRenSub"></span>
                </div>
              </div>
            </div>
            <div class="fg">
              <label class="fl" id="lPropPrice"></label>
              <div class="pfx"><span class="pfx-lbl">$</span><input type="text" class="fi" id="propPrice" oninput="fmtC(this);updDown()" inputmode="numeric" placeholder="450,000"></div>
              <div class="err" id="ePropPrice"></div>
            </div>
            <div class="fg" id="downGrp">
              <label class="fl" id="lDown"></label>
              <div class="cg" id="downPctG" style="margin-bottom:8px">
                <div class="ch" onclick="applyPct(5)" data-p="5">5%</div>
                <div class="ch" onclick="applyPct(10)" data-p="10">10%</div>
                <div class="ch" onclick="applyPct(15)" data-p="15">15%</div>
                <div class="ch" onclick="applyPct(20)" data-p="20">20%+</div>
              </div>
              <div class="pfx"><span class="pfx-lbl">$</span><input type="text" class="fi" id="downPay" oninput="fmtC(this);updDown();clearPctCh()" inputmode="numeric" placeholder="90,000"></div>
              <div class="down-hint" id="downHint"></div>
              <div class="err" id="eDown"></div>
            </div>
            <div class="fg renew-f" id="balGrp">
              <label class="fl" id="lBal"></label>
              <div class="pfx"><span class="pfx-lbl">$</span><input type="text" class="fi" id="remainBal" oninput="fmtC(this)" inputmode="numeric" placeholder="280,000"></div>
              <div class="err" id="eBal"></div>
            </div>
            <div class="fg renew-f" id="renewAmortGrp">
              <label class="fl" id="lRenewAmort"></label>
              <select class="fi fsel" id="renewAmort">
                <option value="5">5 years</option>
                <option value="10">10 years</option>
                <option value="15">15 years</option>
                <option value="20">20 years</option>
                <option value="25" selected>25 years</option>
                <option value="30">30 years</option>
              </select>
            </div>
            <div class="fg renew-f" id="lenderGrp">
              <label class="fl" id="lLender"></label>
              <select class="fi fsel" id="curLender">
                <option value="" id="lenderPh"></option>
                <option value="bmo">BMO</option><option value="rbc">RBC</option>
                <option value="td">TD Bank</option><option value="scotiabank">Scotiabank</option>
                <option value="cibc">CIBC</option><option value="desjardins">Desjardins</option>
                <option value="national">Banque Nationale</option><option value="other" id="lenderOtherOpt"></option>
              </select>
            </div>
            <div class="fg">
              <label class="fl" id="lLocation"></label>
              <select class="fi fsel" id="location">
                <option value="" id="locPh"></option>
                <option value="montreal">Montréal</option><option value="laval">Laval</option>
                <option value="longueuil">Longueuil</option><option value="brossard">Brossard</option>
                <option value="west-island">West Island</option><option value="south-shore">South Shore</option>
                <option value="other" id="locOtherOpt"></option>
              </select>
              <div class="err" id="eLoc"></div>
            </div>
            <div class="snav"><div></div>
              <button class="btn-next" onclick="goTo(2)"><span id="btnCont1"></span> <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
            </div>
          </div>
        </div>

        <!-- STEP 2 -->
        <div class="sp" id="step2">
          <div class="c-title-row"><div class="c-title" id="s2t"></div><div class="c-hint" id="s2h"></div></div>
          <div class="c-body">
            <div class="fg">
              <label class="fl" id="lRate"></label>
              <div class="rate-pill">
                <div style="display:flex;align-items:baseline;gap:6px"><div class="rate-val">5.25%</div><div class="rate-lbl" id="rateDesc"></div></div>
                <div class="rate-lock"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span id="rateLock"></span></div>
              </div>
            </div>
            <div class="fg">
              <label class="fl" id="lAmort"></label>
              <div class="cg" id="amortG">
                <div class="ch ch-h sel" onclick="pick('amortG',this,'25')" id="am25"></div>
                <div class="ch ch-h" onclick="pick('amortG',this,'30')" id="am30"></div>
              </div>
            </div>
            <div class="fg">
              <label class="fl" id="lFreq"></label>
              <div class="cg" id="freqG">
                <div class="ch ch-h sel" onclick="pick('freqG',this,'monthly')" id="fqMo"></div>
                <div class="ch ch-h" onclick="pick('freqG',this,'biweekly')" id="fqBi"></div>
                <div class="ch ch-f" onclick="pick('freqG',this,'accel')" id="fqAc"></div>
              </div>
            </div>
            <div class="snav">
              <button class="btn-back" onclick="goTo(1)">← <span id="btnBack2"></span></button>
              <button class="btn-next" onclick="goTo(3)"><span id="btnCont2"></span> <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
            </div>
          </div>
        </div>

        <!-- STEP 3 -->
        <div class="sp" id="step3">
          <div class="c-title-row"><div class="c-title" id="s3t"></div><div class="c-hint" id="s3h"></div></div>
          <div class="c-body">
            <div class="fg">
              <label class="fl" id="lEmp"></label>
              <div class="cg" id="empG">
                <div class="ch ch-h sel" onclick="pick('empG',this,'employed')" id="empE"></div>
                <div class="ch ch-h" onclick="pick('empG',this,'self')" id="empS"></div>
                <div class="ch ch-h" onclick="pick('empG',this,'contract')" id="empC"></div>
                <div class="ch ch-h" onclick="pick('empG',this,'other')" id="empO"></div>
              </div>
            </div>
            <div class="fg">
              <label class="fl" id="lIncome"></label>
              <select class="fi fsel" id="incomeBracket">
                <option value="" id="incPh"></option>
                <option value="under50" id="incU50"></option>
                <option value="50to75" id="inc50_75"></option>
                <option value="75to100" id="inc75_100"></option>
                <option value="100to125" id="inc100_125"></option>
                <option value="125to150" id="inc125_150"></option>
                <option value="150to175" id="inc150_175"></option>
                <option value="175to200" id="inc175_200"></option>
                <option value="200plus" id="inc200plus"></option>
              </select>
              <div class="err" id="eIncome"></div>
            </div>
            <div class="g2">
              <div class="fg">
                <label class="fl"><span id="lCar"></span> <span class="opt" id="lOpt1"></span></label>
                <div class="pfx"><span class="pfx-lbl">$</span><input type="text" class="fi" id="carPay" placeholder="0" oninput="fmtC(this)" inputmode="numeric"></div>
              </div>
              <div class="fg">
                <label class="fl"><span id="lDebts"></span> <span class="opt" id="lOpt2"></span></label>
                <div class="pfx"><span class="pfx-lbl">$</span><input type="text" class="fi" id="otherDebts" placeholder="0" oninput="fmtC(this)" inputmode="numeric"></div>
              </div>
            </div>
            <div class="fg">
              <label class="fl"><span id="lCredit"></span> <span class="opt" id="lOpt3"></span></label>
              <div class="cg" id="creditG">
                <div class="ch ch-h" onclick="pick('creditG',this,'720+')" id="cr720"></div>
                <div class="ch ch-h" onclick="pick('creditG',this,'680-719')" id="cr680"></div>
                <div class="ch ch-h" onclick="pick('creditG',this,'600-679')" id="cr600"></div>
                <div class="ch ch-h" onclick="pick('creditG',this,'under600')" id="crU600"></div>
              </div>
            </div>
            <div class="snav">
              <button class="btn-back" onclick="goTo(2)">← <span id="btnBack3"></span></button>
              <button class="btn-next" onclick="goTo(4)"><span id="btnGetRes"></span> <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
            </div>
          </div>
        </div>

        <!-- STEP 4: CONTACT -->
        <div class="sp" id="step4">
          <div class="con-hdr"><h4 id="conTitle"></h4><p id="conSub"></p></div>
          <div class="c-body">
            <div class="sp-strip">
              <div class="sp-avs"><div class="sp-av">ML</div><div class="sp-av">SP</div><div class="sp-av">KT</div></div>
              <div class="sp-txt"><strong id="spStrong"></strong><span id="spSub"></span></div>
            </div>
            <div class="fg">
              <label class="fl" id="lName"></label>
              <input type="text" class="fi" id="fullName" autocomplete="name" placeholder="Jean Tremblay">
              <div class="err" id="eName"></div>
            </div>
            <div class="fg">
              <label class="fl" id="lEmail"></label>
              <input type="email" class="fi" id="emailAddr" autocomplete="email" inputmode="email" placeholder="vous@exemple.com">
              <div class="err" id="eEmail"></div>
            </div>
            <div class="fg">
              <label class="fl" id="lTimeline"></label>
              <div class="cg" id="tlG">
                <div class="ch ch-h sel" onclick="pick('tlG',this,'asap')" id="tlASAP"></div>
                <div class="ch ch-h" onclick="pick('tlG',this,'0-3m')" id="tl3m"></div>
                <div class="ch ch-h" onclick="pick('tlG',this,'3-6m')" id="tl6m"></div>
                <div class="ch ch-h" onclick="pick('tlG',this,'6m+')" id="tl6plus"></div>
              </div>
            </div>
            <div class="fg">
              <label class="fl">
                <span id="lPhone"></span>
                <button class="ph-why" onclick="toggleTip(event)" id="whyBtn"></button>
              </label>
              <div class="ph-row">
                <span class="ph-cc">🇨🇦 +1</span>
                <input type="tel" class="fi" id="phoneNum" oninput="fmtPhone(this)" autocomplete="tel" inputmode="tel" placeholder="(514) 000-0000">
              </div>
              <div class="ph-tip" id="phTip"></div>
              <div class="err" id="ePhone"></div>
            </div>
            <label class="consent-lbl" id="consentLbl" onclick="toggleConsent()">
              <div class="consent-box" id="consentBox">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
              <div class="consent-txt" id="consentTxt"></div>
            </label>
            <div class="err" id="eConsent" style="margin-bottom:10px"></div>
            <button class="btn-sub" id="submitBtn" onclick="submitForm()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              <span id="submitTxt"></span>
            </button>
            <div class="trust-row">
              <div class="ti"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span id="tr1"></span></div>
              <div class="ti"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span id="tr2"></span></div>
              <div class="ti"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span id="tr3"></span></div>
            </div>
            <div style="text-align:center;margin-top:10px">
              <button class="btn-back" onclick="goTo(3)">← <span id="btnBack4"></span></button>
            </div>
          </div>
        </div>

        <!-- STEP 5: RESULTS -->
        <div class="sp" id="step5">
          <!-- Qualification banner -->
          <div class="res-hero" id="resHero"></div>
          <!-- 4 key numbers -->
          <div class="res-nums" id="resNums"></div>
          <!-- GDS / TDS ratio bars -->
          <div class="res-ratios" id="resRatios"></div>
          <!-- Teaser copy -->
          <div class="res-cta">
            <div class="res-teaser" id="resTeaser"></div>
          </div>
          <!-- Broker CTA -->
          <div id="resBrokerCta"></div>
          <!-- Redo estimate -->
          <div class="redo-row">
            <button class="redo-btn" onclick="restartEstimate()" id="redoBtn"></button>
          </div>
        </div>

      </div><!-- /calc-card -->
    </div>
  </div>
</section>

<!-- FEATURES -->
<section class="sec-feat">
  <div class="sec-in">
    <div class="sec-ey" id="featEy"></div>
    <h2 class="sec-ttl" id="featTtl"></h2>
    <div class="feat-g">
      <div class="feat-c"><div class="feat-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div><h4 id="f1t"></h4><p id="f1b"></p></div>
      <div class="feat-c"><div class="feat-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div><h4 id="f2t"></h4><p id="f2b"></p></div>
      <div class="feat-c"><div class="feat-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><h4 id="f3t"></h4><p id="f3b"></p></div>
    </div>
  </div>
</section>

<!-- REVIEWS -->
<section class="sec-rev">
  <div class="sec-in">
    <div class="sec-ey" id="revEy"></div>
    <h2 class="sec-ttl" id="revTtl"></h2>
    <div class="rev-g">
      <div class="rev-c"><div class="rev-stars">★★★★★</div><div class="rev-body" id="rv1b"></div><div class="rev-auth" id="rv1a"></div></div>
      <div class="rev-c"><div class="rev-stars">★★★★★</div><div class="rev-body" id="rv2b"></div><div class="rev-auth" id="rv2a"></div></div>
      <div class="rev-c"><div class="rev-stars">★★★★★</div><div class="rev-body" id="rv3b"></div><div class="rev-auth" id="rv3a"></div></div>
    </div>
  </div>
</section>

<footer>
  <strong>MortgageIQ</strong>
  <p id="ftLicense"></p>
  <p style="margin-top:8px;max-width:560px;margin-left:auto;margin-right:auto" id="ftDisc"></p>
  <p style="margin-top:12px"><a href="#" onclick="openPrivacy(event)" id="ftPriv"></a> &nbsp;·&nbsp; <a href="#" id="ftTerms"></a> &nbsp;·&nbsp; <a href="#" id="ftOACIQ"></a></p>
  <p style="margin-top:10px" id="ftCopy"></p>
</footer>

<!-- EXIT INTENT -->
<div class="ov" id="exitOv">
  <div class="ov-box">
    <div class="ov-emoji">⏳</div>
    <h3 id="exitTitle"></h3><p id="exitBody"></p>
    <button class="btn-ov-main" onclick="closeExit()" id="exitStay"></button>
    <button class="btn-ov-ghost" onclick="dismissExit()" id="exitLeave"></button>
  </div>
</div>

<!-- QUAL GATE -->
<div class="ov" id="gateOv">
  <div class="ov-box">
    <div class="ov-emoji">💡</div>
    <h3 id="gateTitle"></h3><p id="gateBody"></p>
    <button class="btn-ov-main" onclick="closeGate(true)" id="gateCont"></button>
    <button class="btn-ov-sec" onclick="closeGate(false)" id="gateBack"></button>
  </div>
</div>

<!-- PRIVACY MODAL -->
<div class="ov" id="privOv" onclick="if(event.target===this)closePrivacy()">
  <div class="priv-box">
    <div class="priv-hdr"><h3 id="privTitle"></h3><button class="priv-close-x" onclick="closePrivacy()">✕</button></div>
    <div class="priv-body" id="privBody"></div>
    <button class="btn-sub" onclick="closePrivacy()" id="privClose" style="max-width:200px;margin:0 auto;padding:11px"></button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// TRANSLATIONS
// ═══════════════════════════════════════════════════════
const T = {

const fmtC=el=>{const r=el.value.replace(/[^0-9]/g,'');el.value=r?Number(r).toLocaleString('en-CA'):''};
const parseMoney=s=>parseInt((s||'0').replace(/[^0-9]/g,''))||0;
const fmtPhone=el=>{
  // Strip all non-digits
  let d=el.value.replace(/\D/g,'');
  // If user typed a leading 1 (country code), strip it so we always work with 10 digits
  if(d.length===11&&d[0]==='1') d=d.slice(1);
  // Cap at 10 digits
  d=d.slice(0,10);
  // Format as (NXX) NXX-XXXX
  if(d.length>=7) d='('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6);
  else if(d.length>=4) d='('+d.slice(0,3)+') '+d.slice(3);
  el.value=d;
};
const showErr=(id,show)=>$(id).classList.toggle('on',show);

// DOWN PAYMENT
// ═══════════════════════════════════════════════════════
function updDown(){
  const price=parseMoney($('propPrice').value);
  const down=parseMoney($('downPay').value);
  const el=$('downHint');
  if(!price||!down){el.innerHTML='';return;}
  const pct=(down/price*100).toFixed(1);
  const ok=down>=price*0.05;
  const over20=down>=price*0.2;
  const tl=T[lang];
  let html=`<span style="font-weight:600">${pct}%</span> `+(lang==='fr'?"du prix d'achat":"of purchase price");
  if(over20){
    html+=` <span style="color:var(--green)">— `+(lang==='fr'?"pas d'assurance SCHL requise ✓":"no CMHC insurance required ✓")+`</span>`;
  } else {
    html+=` <span style="color:var(--gray-400);font-size:0.7rem">— `+(lang==='fr'?"assurance SCHL s'applique":"CMHC insurance applies")+` <span title="${tl.cmhcNote}" style="cursor:help;text-decoration:underline dotted">(?)${lang==='fr'?'':''}</span></span>`;
  }
  el.innerHTML=html;
  el.style.color=ok?'var(--gray-700)':'var(--red)';
}

function applyPct(pct){
  const price=parseMoney($('propPrice').value);
  if(!price){showErr('ePropPrice',true);return;}
  $('downPay').value=Math.round(price*pct/100).toLocaleString('en-CA');
  document.querySelectorAll('#downPctG .ch').forEach(c=>c.classList.toggle('sel',parseInt(c.getAttribute('data-p'))===pct));
  updDown();
}
function clearPctCh(){document.querySelectorAll('#downPctG .ch').forEach(c=>c.classList.remove('sel'));}

function updStepCtr(){$('stepCtr').textContent=(lang==='fr'?'Étape ':'Step ')+step+(lang==='fr'?' sur ':' of ')+5;}

function goTo(n){
  if(n>step&&!validate(step))return;
  if(n===4&&step===3&&!gateOk){if(!checkGate())return;}
  step=n;
  document.querySelectorAll('.sp').forEach((p,i)=>p.classList.toggle('on',i+1===n));
  for(let i=1;i<=5;i++){const d=$('d'+i);d.classList.remove('active','done');if(i===n)d.classList.add('active');else if(i<n)d.classList.add('done');}
  updStepCtr();
  $('progFill').style.width=(n/5*100)+'%';
  if(n===5)renderResults();
  saveProgress();
  setTimeout(()=>$('calc').scrollIntoView({behavior:'smooth',block:'start'}),50);
}

// ═══════════════════════════════════════════════════════
// CALC ENGINE — Canadian semi-annual compounding (Bank Act)
// ═══════════════════════════════════════════════════════
const incMap={under50:40000,'50to75':62500,'75to100':87500,'100to125':112500,'125to150':137500,'150to175':162500,'175to200':187500,'200plus':220000};
const taxR={montreal:0.01085,laval:0.01073,longueuil:0.01053,brossard:0.00924,'west-island':0.01085,'south-shore':0.00980,other:0.01000};

// Canadian mortgages compound semi-annually by law (Bank Act).
// Effective monthly rate = (1 + annualRate/2)^(1/6) - 1
function getMonthlyRate(annualRate){
  return Math.pow(1 + annualRate/2, 1/6) - 1;
}

// Standard amortization payment formula
function calcPayment(principal, monthlyRate, nPayments){
  if(monthlyRate === 0) return principal / nPayments;
  return principal * (monthlyRate * Math.pow(1+monthlyRate, nPayments)) / (Math.pow(1+monthlyRate, nPayments) - 1);
}

// Balance remaining after k payments
function calcBalance(principal, monthlyRate, nTotal, k){
  return principal * Math.pow(1+monthlyRate, k) - calcPayment(principal,monthlyRate,nTotal) * (Math.pow(1+monthlyRate,k)-1)/monthlyRate;
}

// Total interest paid between payment 1 and payment k
function calcInterestPaid(principal, monthlyRate, nTotal, k){
  const pmt = calcPayment(principal, monthlyRate, nTotal);
  const totalPaid = pmt * k;
  const balRemaining = calcBalance(principal, monthlyRate, nTotal, k);
  const principalPaid = principal - balRemaining;
  return totalPaid - principalPaid;
}

function calcMtg(){
  const price    = parseMoney($('propPrice').value);
  const loc      = $('location').value;
  const amort    = parseInt(picks.amortG);         // years (25 or 30)
  const termYrs  = 5;                               // fixed 5-year term
  const freq     = picks.freqG;
  const annRate  = 0.0525;                          // 5.25% nominal
  const inc      = incMap[$('incomeBracket').value] || 75000;
  const car      = parseMoney($('carPay').value);
  const debts    = parseMoney($('otherDebts').value);

  const down      = purpose==='purchase' ? parseMoney($('downPay').value) : 0;
  const principal = purpose==='purchase' ? price - down : parseMoney($('remainBal').value);

  // Canadian effective monthly rate (semi-annual compounding)
  const r  = getMonthlyRate(annRate);
  const nA = amort * 12;          // total payments over amortization
  const nT = termYrs * 12;        // payments over term (60)

  // Monthly mortgage payment (always calculated monthly, then converted)
  const mMtg = calcPayment(principal, r, nA);

  // Display payment by frequency
  let disPay, payLbl, payFreqLabel, paymentsPerYear, nTermDisplay;
  if(freq==='monthly'){
    disPay=mMtg; payLbl='/mo';
    payFreqLabel=lang==='fr'?'mensuel (12x/an)':'monthly (12x/year)';
    paymentsPerYear=12; nTermDisplay=nT;
  } else if(freq==='biweekly'){
    disPay=mMtg*12/26; payLbl='/2wk';
    payFreqLabel=lang==='fr'?'aux deux semaines (26x/an)':'biweekly (26x/year)';
    paymentsPerYear=26; nTermDisplay=termYrs*26;
  } else {
    // Accelerated biweekly: pay half monthly payment every 2 weeks
    // Results in one extra monthly payment per year → pays off faster
    disPay=mMtg/2; payLbl='/2wk';
    payFreqLabel=lang==='fr'?'bihebdomadaire accéléré (26x/an)':'accelerated biweekly (26x/year)';
    paymentsPerYear=26; nTermDisplay=termYrs*26;
  }

  // Term figures (5 years)
  const termInterest   = calcInterestPaid(principal, r, nA, nT);
  const termBalance    = Math.max(calcBalance(principal, r, nA, nT), 0);
  const termPrincipal  = principal - termBalance;
  const termTotalPaid  = mMtg * nT;

  // Full amortization figures
  const fullInterest   = mMtg * nA - principal;
  const fullTotalPaid  = mMtg * nA;

  // Taxes (municipal + school) based on property value and location
  const tax  = (price*(taxR[loc]||0.01)/12) + (price*0.00154/12);
  const heat = 150; // standard heating estimate

  // Total housing cost (monthly)
  const totHousing = mMtg + tax + heat;

  // GDS & TDS ratios
  const mInc = inc / 12;
  const GDS  = (totHousing / mInc) * 100;
  const TDS  = ((totHousing + car + debts) / mInc) * 100;

  // Qualification colour
  let col, emoji;
  if(GDS<=39 && TDS<=44)      { col='green';  emoji='✓'; }
  else if(GDS<=43 || TDS<=48) { col='yellow'; emoji='~'; }
  else                         { col='red';    emoji='!'; }

  // Max purchase price back-calculation
  const maxMPay  = mInc*0.39 - tax - heat;
  const maxPrin  = maxMPay>0 ? maxMPay*(Math.pow(1+r,nA)-1)/(r*Math.pow(1+r,nA)) : 0;
  const maxPrice = maxPrin + down;

  return {
    disPay, payLbl, payFreqLabel, paymentsPerYear,
    nTermDisplay, nTermMonthly:nT, nAmortMonthly:nA,
    mMtg, tax, heat, totHousing,
    GDS, TDS, col, emoji,
    maxPrice, principal, down,
    termYrs, amort, annRate,
    termInterest, termPrincipal, termBalance, termTotalPaid,
    fullInterest, fullTotalPaid,
    price
  };
}

// ═══════════════════════════════════════════════════════
// COUNT-UP
// ═══════════════════════════════════════════════════════
function countUp(el,target,dur){
  const start=performance.now();
  (function step(now){
    const p=Math.min((now-start)/dur,1);
    const e=1-Math.pow(1-p,3);
    el.textContent='$'+Math.round(target*e).toLocaleString('en-CA');
    if(p<1)requestAnimationFrame(step);
  })(start);
}

// ═══════════════════════════════════════════════════════
// TOOLTIP PORTAL — click/tap to toggle, works on all devices
// ═══════════════════════════════════════════════════════
(function(){
  const portal = document.createElement('div');
  portal.className = 'tip-portal';
  portal.style.display = 'none';
  document.body.appendChild(portal);

  let current = null;

  function position(el) {
    const rect = el.getBoundingClientRect();
    const pW   = portal.offsetWidth;
    const pH   = portal.offsetHeight;
    const margin = 12;
    const vw   = window.innerWidth;

    // Arrow: show above if room, otherwise below
    let top, arrowDir;
    if (rect.top - pH - 14 >= margin) {
      top = rect.top + window.scrollY - pH - 10;
      arrowDir = 'arr-down';
    } else {
      top = rect.bottom + window.scrollY + 10;
      arrowDir = 'arr-up';
    }

    // Centre horizontally, clamp to viewport edges
    let left = rect.left + rect.width / 2 - pW / 2;
    left = Math.max(margin, Math.min(left, vw - pW - margin));

    portal.style.top  = top + 'px';
    portal.style.left = left + 'px';
    portal.className  = 'tip-portal ' + arrowDir;
  }

  function open(el) {
    if (current) current.classList.remove('tip-open');
    current = el;
    el.classList.add('tip-open');
    portal.textContent = el.getAttribute('data-tip');
    portal.style.display = 'block';
    // Re-position after content is set so offsetWidth is accurate
    requestAnimationFrame(() => position(el));
  }

  function close() {
    portal.style.display = 'none';
    if (current) { current.classList.remove('tip-open'); current = null; }
  }

  // Guard: only real Element nodes have .closest()
  function fromEvent(e) {
    return (e.target && e.target.nodeType === 1 && typeof e.target.closest === 'function')
      ? e.target.closest('.info-i[data-tip]')
      : null;
  }

  // Single click — works for mouse AND tap on every device
  document.addEventListener('click', e => {
    const el = fromEvent(e);
    if (el) { current === el ? close() : open(el); }
    else close();
  });

  // Desktop hover
  document.addEventListener('mouseenter', e => { const el = fromEvent(e); if (el) open(el); }, true);
  document.addEventListener('mouseleave', e => { const el = fromEvent(e); if (el) close(); }, true);

  // Keyboard
  document.addEventListener('keydown', e => {
    const el = fromEvent(e);
    if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); current === el ? close() : open(el); }
    if (e.key === 'Escape') close();
  });
})();

  step = 1;
  consent = false;
  purpose = 'purchase';
  gateOk = false;
  exitShown = false;
  Object.assign(picks, { amortG:'25', freqG:'monthly', empG:'employed', creditG:'', tlG:'asap' });

  // Reset form fields
  ['propPrice','downPay','remainBal','carPay','otherDebts','fullName','emailAddr','phoneNum'].forEach(id => {
    const el = $(id);
    if (el) el.value = '';
  });
  ['location','curLender','incomeBracket'].forEach(id => {
    const el = $(id);
    if (el) el.selectedIndex = 0;
  });
  $('downHint').innerHTML = '';

  // Reset purpose UI
  setPurpose($('cpPurchase'), 'purchase');

  // Reset chip selections
  document.querySelectorAll('.ch.sel').forEach(c => c.classList.remove('sel'));
  // Re-select defaults
  document.querySelectorAll('#amortG .ch')[0]?.classList.add('sel');
  document.querySelectorAll('#freqG .ch')[0]?.classList.add('sel');
  document.querySelectorAll('#empG .ch')[0]?.classList.add('sel');
  document.querySelectorAll('#tlG .ch')[0]?.classList.add('sel');

  // Reset consent
  $('consentLbl')?.classList.remove('chk');

  // Clear localStorage
  try { localStorage.removeItem('mqiq'); } catch(e) {}

  // Go to step 1 and scroll
  document.querySelectorAll('.sp').forEach((p, i) => p.classList.toggle('on', i === 0));
  for (let i = 1; i <= 5; i++) {
    const d = $('d' + i);
    d.classList.remove('active', 'done');
    if (i === 1) d.classList.add('active');
  }
  updStepCtr();
  $('progFill').style.width = '20%';

  // Scroll to top smoothly
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => $('calc').scrollIntoView({ behavior: 'smooth', block: 'start' }), 300);
}

// VELOCITY CRM CONFIGURATION
// Fill in your API key and domain from Velocity → Settings
// ═══════════════════════════════════════════════════════
const VELOCITY_CONFIG = {
  apiKey: '',          // ← Paste your Velocity API key here
  domain: '',          // ← Your registered domain (e.g. mortgageiq.ca)
  endpoint: 'https://velocity.newton.ca/api/v1/contacts/lead',
};

// Maps our lead object to the Velocity API IN schema
// Velocity API IN docs: http://developer.newton.ca/velocity/v1/
function buildVelocityPayload(lead) {
  // Split full name into first/last
  const nameParts = (lead.name || '').trim().split(/\s+/);
  const firstName = nameParts[0] || '';
  const lastName  = nameParts.slice(1).join(' ') || '';

  // Map income bracket midpoints to annual income
  const incomeMap = {
    under50: 40000, '50to75': 62500, '75to100': 87500,
    '100to125': 112500, '125to150': 137500,
    '150to175': 162500, '175to200': 187500, '200plus': 220000
  };

  // Velocity API IN — Lead schema
  // See: http://developer.newton.ca/velocity/v1/#leads
  return {
    // Authentication
    api_key: VELOCITY_CONFIG.apiKey,
    domain:  VELOCITY_CONFIG.domain,

    // Contact details
    first_name: firstName,
    last_name:  lastName,
    email:      lead.email,
    phone:      lead.phone.replace(/\D/g, ''),   // digits only
    language:   lead.lang === 'fr' ? 'French' : 'English',

    // Lead classification
    lead_type:  lead.purpose === 'renewal' ? 'Renewal' : 'Purchase',
    source:     'Website Calculator',
    notes: [
      `Qualification: ${lead.qual.toUpperCase()} (GDS ${lead.GDS}% / TDS ${lead.TDS}%)`,
      `Property Value: $${(lead.propVal||0).toLocaleString('en-CA')}`,
      lead.purpose === 'purchase'
        ? `Down Payment: $${(lead.downPay||0).toLocaleString('en-CA')}`
        : `Remaining Balance: $${(lead.remainBal||0).toLocaleString('en-CA')}`,
      `Location: ${lead.location}`,
      `Income Bracket: ${lead.income}`,
      `Employment: ${lead.empType}`,
      `Timeline: ${lead.timeline}`,
      lead.credit ? `Credit Score Range: ${lead.credit}` : '',
      `Submitted: ${new Date(lead.ts).toLocaleString('en-CA')}`,
    ].filter(Boolean).join(' | '),

    // Mortgage details
    purchase_price:  lead.propVal     || 0,
    down_payment:    lead.downPay     || 0,
    mortgage_amount: lead.purpose === 'purchase'
      ? (lead.propVal - lead.downPay)
      : (lead.remainBal || 0),
    annual_income:   incomeMap[lead.income] || 0,

    // Consent
    consent: lead.consent,
    consent_timestamp: lead.consentTs,
  };
}

async function sendToVelocity(lead) {
  if (!VELOCITY_CONFIG.apiKey) {
    console.warn('Velocity API key not set — skipping CRM sync.');
    return;
  }
  try {
    const payload = buildVelocityPayload(lead);
    const res = await fetch(VELOCITY_CONFIG.endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json',
        'X-API-Key': VELOCITY_CONFIG.apiKey,
      },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const err = await res.text();
      console.error('Velocity API error:', res.status, err);
    } else {
      const data = await res.json();
      console.log('Velocity lead created:', data);
    }
  } catch (err) {
    console.error('Velocity sync failed:', err);
  }
}

const BROKER = {

  title_en:'Licensed Mortgage Broker',
  title_fr:'Courtier hypothécaire agréé',
  phone:   '+15140000000',        // ← Replace with real phone (no spaces)
  phoneDisplay: '(514) 000-0000', // ← Display format
  email:   'info@mortgageiq.ca',  // ← Replace with real email
  website: 'mortgageiq.ca',       // ← Replace with real domain
  amfNumber: '',                  // ← Optional: AMF licence number
};

function openVcard() {
  const isFR = lang === 'fr';
  // Update card content with broker info
  $('vcName').textContent = BROKER.name;
  $('vcTitle').textContent = (isFR ? BROKER.title_fr : BROKER.title_en)
    + (BROKER.amfNumber ? ` · ${isFR?'Licence AMF':'AMF Licence'} #${BROKER.amfNumber}` : '');
  $('vcPhoneLink').textContent = BROKER.phoneDisplay;
  $('vcPhoneLink').href = 'tel:' + BROKER.phone;
  $('vcEmailLink').textContent = BROKER.email;
  $('vcEmailLink').href = 'mailto:' + BROKER.email;
  $('vcWebLink').textContent = BROKER.website;
  $('vcWebLink').href = 'https://' + BROKER.website;
  // Button labels
  $('vcCallTxt').textContent  = isFR ? 'Appeler maintenant' : 'Call Now';
  $('vcSaveTxt').textContent  = isFR ? 'Enregistrer le contact' : 'Save Contact';
  $('vcCloseTxt').textContent = isFR ? 'Fermer' : 'Close';
  // Show modal
  $('vcardOv').classList.add('on');
  document.body.style.overflow = 'hidden';
}

function closeVcard() {
  $('vcardOv').classList.remove('on');
  document.body.style.overflow = '';
}

function callBroker() {
  window.location.href = 'tel:' + BROKER.phone;
}

function saveVcard() {
  const isFR = lang === 'fr';
  // Build .vcf file content (vCard 3.0 standard)
  const vcf = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'FN:' + BROKER.name,
    'ORG:MortgageIQ',
    'TITLE:' + (isFR ? BROKER.title_fr : BROKER.title_en),
    'TEL;TYPE=CELL:' + BROKER.phone,
    'EMAIL:' + BROKER.email,
    'URL:https://' + BROKER.website,
    BROKER.amfNumber ? 'NOTE:AMF Licence #' + BROKER.amfNumber : '',
    'END:VCARD'
  ].filter(Boolean).join('\r\n');

  const blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = BROKER.name.replace(/\s+/g, '_') + '.vcf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Swipe down to close on mobile
(function(){
  const sheet = $('vcardSheet');
  let startY = 0, isDragging = false;
  sheet.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    isDragging = true;
  }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (!isDragging) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0) sheet.style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  sheet.addEventListener('touchend', e => {
    isDragging = false;
    const dy = e.changedTouches[0].clientY - startY;
    if (dy > 80) {
      closeVcard();
    }
    sheet.style.transform = '';
  });
})();
